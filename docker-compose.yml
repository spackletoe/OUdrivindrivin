# Sample compose for uRacing?
# 1. Copy .env.example → .env and fill in DISCORD_BOT_TOKEN
# 2. Edit config/settings.yaml (channel_id + mqtt) and config/drivers.yaml
# 3. docker compose up -d --build
#
# Prefer a prebuilt image from a GitHub Release / GHCR when available:
#   image: ghcr.io/spackletoe/uracing:latest
#
# Note: Docker container_name cannot include "?". Brand as "uRacing?" in Discord / docs.

services:
  uracing:
    build: .
    image: ghcr.io/spackletoe/uracing:latest
    container_name: uRacing
    env_file:
      - .env
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
      IRACING_EMAIL: ${IRACING_EMAIL:-}
      IRACING_PASSWORD: ${IRACING_PASSWORD:-}
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
    # Uncomment if you enable the optional mqtt service below:
    # depends_on:
    #   - mqtt

  # Optional local MQTT broker — enable only if you do not already have one.
  # mqtt:
  #   image: eclipse-mosquitto:2
  #   volumes:
  #     - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
  #   ports:
  #     - "1883:1883"
